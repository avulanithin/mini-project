<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blood Donation Camp Simulation{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>
                    <span class="brand-icon">🩸</span>
                    BD Camp Simulator
                </h1>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/" id="nav-home">Home</a></li>
                <li><a href="/setup" id="nav-setup">Setup Camp</a></li>
                <li><a href="/history" id="nav-history">History</a></li>
                <li><a href="/compare" id="nav-compare">Compare</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>Blood Donation Camp Queue Simulation &amp; Planning System</p>
            <p>Discrete-Event Simulation &nbsp;·&nbsp; v1.0.0 &nbsp;·&nbsp; &copy; 2026</p>
        </div>
    </footer>

    <script>
        // Highlight active nav link
        (function() {
            const path = window.location.pathname;
            const map = { '/': 'nav-home', '/setup': 'nav-setup', '/history': 'nav-history', '/compare': 'nav-compare' };
            const cleanPath = path.split('?')[0].replace(/\/results\/\d+/, '/history');
            const id = map[cleanPath] || (path.startsWith('/results') ? 'nav-history' : 'nav-home');
            const el = document.getElementById(id);
            if (el) el.classList.add('active');
        })();
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
